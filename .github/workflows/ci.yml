name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements-dev.txt
      - run: pytest -q
      - name: Evaluate multiple synthetic matches and adversarial agent recovery
        env:
          MATCHSHIFT_INFERENCE: deterministic
        run: python -m scripts.evaluate --out artifacts/evaluation
      - name: Upload reproducible judging evidence
        uses: actions/upload-artifact@v4
        with:
          name: matchshift-evaluation
          path: artifacts/evaluation/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  static_bundle:
    runs-on: ubuntu-latest
    env:
      MATCHSHIFT_INFERENCE: deterministic
      VITE_STATIC_DEMO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r services/api/requirements.txt
      - name: Run and verify actual offline Agent Framework exports
        run: |
          python -m scripts.export_static --output apps/web/public/data
          python -m scripts.export_static --output apps/web/public/data --verify-only
      - run: npm install
        working-directory: apps/web
      - name: Compile standalone judge demo
        run: npm run build
        working-directory: apps/web
      - name: Check deployed artifact contains data and relative assets
        run: |
          test -s apps/web/dist/data/replay.json
          test -s apps/web/dist/data/stories.json
          test -s apps/web/dist/data/trust_lab.json
          grep -q './assets/' apps/web/dist/index.html

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start standalone public-site preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/matchshift-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Public offline preview is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/matchshift-preview.log
          exit 1
        working-directory: apps/web
      - name: Verify judge experience in desktop and mobile browsers
        run: npm run test:e2e
        working-directory: apps/web
      - name: Retain browser failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matchshift-playwright-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  public_azure:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current public Azure production site from GitHub runner
        run: python -m scripts.check_public_site --url https://jolly-bay-020154010.1.azurestaticapps.net --attempts 6 --retry-seconds 8

  foundry_transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional Microsoft OpenAI transport integration
        run: python -m pip install -r services/api/requirements-dev.txt -r services/api/requirements-local.txt
      - name: Exercise both model-backed Agent Framework roles over local HTTP
        run: python -m pytest tests/test_foundry_transport.py tests/test_local_endpoint.py -q
