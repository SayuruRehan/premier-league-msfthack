name: Deploy judge demo to Azure Static Web Apps
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MATCHSHIFT_INFERENCE: deterministic
      VITE_STATIC_DEMO: 'true'
      SWA_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend requirements
        run: python -m pip install -r services/api/requirements.txt
      - name: Generate and verify offline judging data
        run: |
          python -m scripts.export_static --output apps/web/public/data
          python -m scripts.export_static --output apps/web/public/data --verify-only
      - name: Install UI dependencies
        run: npm install
        working-directory: apps/web
      - name: Build fully offline UI
        run: npm run build
        working-directory: apps/web
      - name: Deploy to Azure (when token is configured)
        if: ${{ env.SWA_DEPLOYMENT_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/dist
          output_location: ''
          skip_app_build: true
      - name: Explain missing Azure setup
        if: ${{ env.SWA_DEPLOYMENT_TOKEN == '' }}
        run: echo "Built and verified the offline demo. Azure publishing skipped until AZURE_STATIC_WEB_APPS_API_TOKEN is configured."
